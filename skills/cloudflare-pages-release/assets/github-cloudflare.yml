# Copy into the destination repository only after adapting its branch/scripts/vars.
# This is a template, not this toolkit's own active deployment workflow.
name: Validate and deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Test form handling and redirects
        run: npm test
      - name: Build website
        run: npm run build
      - name: Verify migrated content, SEO and assets
        run: npm run verify
      - name: Deploy Worker and Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_PAGES_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ] || [ -z "$PUBLIC_SITE_URL" ]; then
            echo '::error::Configure the Cloudflare token secret and account/project/site URL variables.'
            exit 1
          fi
          npm run worker:deploy
          npx --no-install wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
      - name: Verify hosted routes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PREVIEW_URL: ${{ vars.CLOUDFLARE_PAGES_URL }}
        run: npm run verify:cloudflare
      - name: Verify contact configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_PAGES_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 "${PUBLIC_SITE_URL%/}/api/contact" | node --input-type=module -e '
            const chunks=[]; for await (const chunk of process.stdin) chunks.push(chunk);
            const config=JSON.parse(Buffer.concat(chunks));
            if (!config.siteKey) throw new Error("Contact service is unavailable");
            console.log("Hosted contact configuration is ready; email delivery is not tested by this check");
          '
      - name: Record successful release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_PAGES_URL }}
        run: |
          echo "Deployed commit $GITHUB_SHA to $PUBLIC_SITE_URL; hosted smoke checks passed." >> "$GITHUB_STEP_SUMMARY"
